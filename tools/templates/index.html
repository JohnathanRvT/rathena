<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rAthena Efficiency Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .card { margin-bottom: 20px; }
        .table-responsive { max-height: 600px; }
        .nav-tabs .nav-link { cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">rAthena Efficiency Calculator</h1>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Character & Server Config</h5>
                        <form id="calcForm">
                            <div class="row mb-2">
                                <div class="col">
                                    <label class="form-label">Mode</label>
                                    <select class="form-select form-select-sm" name="pre_re" id="pre_re">
                                        <option value="false">Renewal</option>
                                        <option value="true">Pre-Renewal</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="form-label">Level</label>
                                    <input type="number" class="form-control form-control-sm" name="char_level" value="100">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col">
                                    <label class="form-label">Attack</label>
                                    <input type="number" class="form-control form-control-sm" name="atk" value="300">
                                </div>
                                <div class="col">
                                    <label class="form-label">Hit</label>
                                    <input type="number" class="form-control form-control-sm" name="hit" value="350">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col">
                                    <label class="form-label">Aspd</label>
                                    <input type="number" class="form-control form-control-sm" name="aspd" value="185">
                                </div>
                                <div class="col">
                                    <label class="form-label">Flee</label>
                                    <input type="number" class="form-control form-control-sm" name="flee" value="250">
                                </div>
                            </div>
                            <hr>
                            <div class="row mb-2">
                                <div class="col">
                                    <label class="form-label">Base Drop Rate (x)</label>
                                    <input type="number" class="form-control form-control-sm" name="base_drop_rate" value="1">
                                </div>
                                <div class="col">
                                    <label class="form-label">Base Exp Rate (x)</label>
                                    <input type="number" class="form-control form-control-sm" name="base_exp_rate" value="1">
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Overcharge Level</label>
                                <input type="range" class="form-range" name="oc" min="0" max="10" value="10">
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="gum" id="gum">
                                <label class="form-check-label" for="gum">Bubble Gum (+100% Drop)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="manual" id="manual">
                                <label class="form-check-label" for="manual">Battle Manual (+50% Exp)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="job_manual" id="job_manual">
                                <label class="form-check-label" for="job_manual">Job Manual (+50% Job Exp)</label>
                            </div>
                            <hr>
                            <div class="mb-3">
                                <label class="form-label">Optimize For</label>
                                <select class="form-select" name="optimize_for">
                                    <option value="zeny">Best Zeny Rate</option>
                                    <option value="exp">Best Exp Rate</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Calculate & Rank</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <ul class="nav nav-tabs" id="myTab" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active" id="results-tab" data-bs-toggle="tab" data-bs-target="#results" type="button">Ranked Monsters</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" id="maps-tab" data-bs-toggle="tab" data-bs-target="#maps" type="button">Ranked Maps</button>
                            </li>
                        </ul>
                        <div class="tab-content pt-3">
                            <div class="tab-pane fade show active" id="results">
                                <div class="table-responsive">
                                    <table class="table table-hover table-sm" id="resultTable">
                                        <thead>
                                            <tr>
                                                <th>Monster</th>
                                                <th>Lv</th>
                                                <th>Zeny/hr</th>
                                                <th>Exp/hr</th>
                                                <th>TTK</th>
                                                <th>Hit%</th>
                                                <th>Flee%</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr><td colspan="7" class="text-center">Run calculation...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="maps">
                                <div class="table-responsive">
                                    <table class="table table-hover table-sm" id="mapTable">
                                        <thead>
                                            <tr>
                                                <th>Map</th>
                                                <th>Potential Zeny/hr</th>
                                                <th>Potential Exp/hr</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr><td colspan="3" class="text-center">Run calculation...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('calcForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const params = new URLSearchParams(formData);

            const response = await fetch('/api/calculate?' + params.toString());
            const data = await response.json();

            const mobBody = document.querySelector('#resultTable tbody');
            mobBody.innerHTML = '';
            data.mobs.forEach(m => {
                const row = `<tr>
                    <td>${m.name} (${m.id})</td>
                    <td>${m.level}</td>
                    <td>${Math.round(m.zeny_hr).toLocaleString()} z</td>
                    <td>${Math.round(m.exp_hr).toLocaleString()}</td>
                    <td>${m.ttk.toFixed(1)}s</td>
                    <td>${m.hit_chance}%</td>
                    <td>${m.flee_chance}%</td>
                </tr>`;
                mobBody.innerHTML += row;
            });

            const mapBody = document.querySelector('#mapTable tbody');
            mapBody.innerHTML = '';
            data.maps.forEach(m => {
                const row = `<tr>
                    <td>${m.map}</td>
                    <td>${Math.round(m.zeny_hr).toLocaleString()} z</td>
                    <td>${Math.round(m.exp_hr).toLocaleString()}</td>
                </tr>`;
                mapBody.innerHTML += row;
            });
        };
    </script>
</body>
</html>
