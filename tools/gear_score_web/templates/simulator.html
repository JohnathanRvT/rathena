<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Score Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding-top: 2rem; }
        .slot-card { margin-bottom: 1rem; border-left: 4px solid #0d6efd; }
        .score-display { font-size: 3rem; font-weight: bold; color: #0d6efd; }
        .search-results { position: absolute; z-index: 1000; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Gear Score Simulator</h1>

        <div class="row">
            <div class="col-md-8">
                <div id="equipment-slots">
                    <!-- Slots will be generated here -->
                </div>
            </div>

            <div class="col-md-4">
                <div class="card sticky-top" style="top: 2rem;">
                    <div class="card-body text-center">
                        <h5>Total Gear Score</h5>
                        <div id="total-score" class="score-display">0</div>
                        <hr>
                        <div id="breakdown" class="text-start small">
                            <p class="text-muted">Equip items to see breakdown...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const slots = [
            'Head Top', 'Head Mid', 'Head Low',
            'Armor', 'Weapon', 'Shield',
            'Garment', 'Shoes',
            'Accessory L', 'Accessory R'
        ];

        const state = {};

        function init() {
            const container = document.getElementById('equipment-slots');
            slots.forEach(slot => {
                state[slot] = { id: null, name: '', refine: 0, cards: [0, 0, 0, 0] };

                const card = document.createElement('div');
                card.className = 'card slot-card';
                card.innerHTML = `
                    <div class="card-body">
                        <h6 class="card-title">${slot}</h6>
                        <div class="row g-2">
                            <div class="col-md-6 position-relative">
                                <input type="text" class="form-control form-control-sm" placeholder="Search item..." oninput="searchItems('${slot}', this.value)">
                                <div id="results-${slot.replace(' ', '-')}" class="list-group search-results"></div>
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control form-control-sm" placeholder="Refine" min="0" max="20" value="0" onchange="updateRefine('${slot}', this.value)">
                            </div>
                            <div class="col-md-4 d-flex gap-1">
                                <input type="number" class="form-control form-control-sm" placeholder="C1" onchange="updateCard('${slot}', 0, this.value)">
                                <input type="number" class="form-control form-control-sm" placeholder="C2" onchange="updateCard('${slot}', 1, this.value)">
                                <input type="number" class="form-control form-control-sm" placeholder="C3" onchange="updateCard('${slot}', 2, this.value)">
                                <input type="number" class="form-control form-control-sm" placeholder="C4" onchange="updateCard('${slot}', 3, this.value)">
                            </div>
                        </div>
                        <div id="selected-${slot.replace(' ', '-')}" class="mt-2 small text-primary fw-bold"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function searchItems(slot, query) {
            const resultsDiv = document.getElementById(`results-${slot.replace(' ', '-')}`);
            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            const response = await fetch(`/api/items/search?q=${encodeURIComponent(query)}`);
            const items = await response.json();

            resultsDiv.innerHTML = items.map(item => `
                <button type="button" class="list-group-item list-group-item-action small" onclick="selectItem('${slot}', ${item.id}, '${item.name.replace(/'/g, "\\'")}')">
                    [${item.id}] ${item.name}
                </button>
            `).join('');
        }

        function selectItem(slot, id, name) {
            state[slot].id = id;
            state[slot].name = name;
            document.getElementById(`selected-${slot.replace(' ', '-')}`).innerText = `Selected: ${name} (${id})`;
            document.getElementById(`results-${slot.replace(' ', '-')}`).innerHTML = '';
            calculateScore();
        }

        function updateRefine(slot, value) {
            state[slot].refine = parseInt(value) || 0;
            calculateScore();
        }

        function updateCard(slot, index, value) {
            state[slot].cards[index] = parseInt(value) || 0;
            calculateScore();
        }

        async function calculateScore() {
            const response = await fetch('/api/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(state)
            });
            const data = await response.json();

            document.getElementById('total-score').innerText = data.total_score;
            document.getElementById('breakdown').innerHTML = data.breakdown.map(b => `
                <div class="d-flex justify-content-between">
                    <span>${b.slot}: ${b.name}</span>
                    <span class="fw-bold">${b.score}</span>
                </div>
            `).join('') || '<p class="text-muted">Equip items to see breakdown...</p>';
        }

        init();
    </script>
</body>
</html>
